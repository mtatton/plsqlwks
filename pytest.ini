[pytest]
pythonpath = .
junit_family = xunit2
markers =
    integration: tests that exercise external systems or installed artifacts
    oracle: tests that require a reachable Oracle database
    oracle_matrix: tests that require the complete guarded Oracle compatibility matrix
    plugin: optional tests for the plugin API and built-in plugins
    pty: tests that allocate a pseudo-terminal
    slow: tests that are intentionally slower than the default suite
