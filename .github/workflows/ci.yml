name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  repository-hygiene:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, plsqlwks]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Check repository hygiene
        run: |
          python - <<'PY'
          from pathlib import Path

          generated = [Path("PKG-INFO"), Path("build"), Path("dist")]
          generated.extend(Path.cwd().glob("*.egg-info"))
          present = sorted(str(path) for path in generated if path.exists())
          if present:
              raise SystemExit(
                  "generated packaging artifacts are tracked: " + ", ".join(present)
              )
          PY

  quality:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, plsqlwks]
    env:
      MYPY_TARGETS: >-
        plsqlwks/config/__init__.py
        plsqlwks/config/models.py
        plsqlwks/config/paths.py
        plsqlwks/config/settings.py
        plsqlwks/config/session.py
        plsqlwks/config/loader.py
        plsqlwks/workspace.py
        plsqlwks/sqlbinds.py
        plsqlwks/sqlsplit.py
        plsqlwks/db/models.py
        plsqlwks/db/transactions.py
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable '.[dev]'
      - name: Run quality checks
        run: |
          python -m ruff check plsqlwks tests tools
          python -m mypy $MYPY_TARGETS
          python -m mypy --follow-imports=skip \
            plsqlwks/plugins \
            plsqlwks/ui/plugin_host.py \
            plsqlwks/exporting.py

  test-non-oracle:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, plsqlwks]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      PLSQLWKS_TEST_PTY: "1"
      PLSQLWKS_TEST_SLOW: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable '.[dev]'
      - name: Run non-Oracle tests
        run: python -m pytest --strict-markers -m 'not oracle'

  test-plugins:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, plsqlwks]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      PLSQLWKS_TEST_PLUGINS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install plugin test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable '.[dev]'
          python -m pip install --editable '.[xlsx]'
      - name: Run plugin tests
        run: python -m pytest --strict-markers -m plugin

  build-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, plsqlwks]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable '.[dev]'
      - name: Build and inspect distributions
        run: |
          python -m build
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          from zipfile import ZipFile

          from packaging.requirements import Requirement

          wheels = list(Path("dist").glob("plsqlwks-*.whl"))
          source_archives = list(Path("dist").glob("plsqlwks-*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(source_archives) == 1, source_archives
          with ZipFile(wheels[0]) as archive:
              metadata_name = next(
                  name
                  for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              wheel_metadata = archive.read(metadata_name).decode("utf-8")
          with tarfile.open(source_archives[0]) as archive:
              names = archive.getnames()
              assert any(name.endswith("/license.txt") for name in names)
              pkg_info_name = next(
                  name for name in names if name.endswith("/PKG-INFO")
              )
              pkg_info_file = archive.extractfile(pkg_info_name)
              assert pkg_info_file is not None
              pkg_info = pkg_info_file.read().decode("utf-8")
          assert "License-Expression: LicenseRef-plsqlwks-Donationware" in pkg_info
          assert "License-File: license.txt" in pkg_info
          assert "Project-URL: Repository, https://gitlab.com/unununu/plsqlwks" in pkg_info
          assert (
              "https://gitlab.com/unununu/plsqlwks/-/raw/main/img/preview.png"
              in pkg_info
          )

          def assert_author_details(raw_metadata):
              metadata = Parser().parsestr(raw_metadata)
              assert metadata["Author"] == "unu2000"
              assert metadata["Author-email"] is None
              assert metadata["Maintainer"] is None
              assert metadata["Maintainer-email"] is None
              assert (
                  "Ko-fi, https://ko-fi.com/unu2000"
                  in metadata.get_all("Project-URL", [])
              )

          def assert_xlsx_extra(raw_metadata):
              metadata = Parser().parsestr(raw_metadata)
              assert "xlsx" in metadata.get_all("Provides-Extra", [])
              requirements = [
                  Requirement(value)
                  for value in metadata.get_all("Requires-Dist", [])
              ]
              openpyxl = [
                  requirement
                  for requirement in requirements
                  if requirement.name.casefold() == "openpyxl"
              ]
              assert len(openpyxl) == 1, openpyxl
              requirement = openpyxl[0]
              assert str(requirement.specifier) == ">=3.1"
              assert requirement.marker is not None
              assert requirement.marker.evaluate({"extra": "xlsx"})
              assert not requirement.marker.evaluate({"extra": ""})
              assert not requirement.marker.evaluate({"extra": "dev"})

          assert_xlsx_extra(pkg_info)
          assert_xlsx_extra(wheel_metadata)
          assert_author_details(pkg_info)
          assert_author_details(wheel_metadata)
          PY
      - name: Smoke-test wheel
        run: |
          set -euo pipefail
          SMOKE_ROOT="$(mktemp -d)"
          trap 'rm -rf -- "$SMOKE_ROOT"' EXIT
          SMOKE_PYTHON="$SMOKE_ROOT/venv/bin/python"
          SMOKE_WHEEL="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -type f -name 'plsqlwks-*.whl' -print -quit)"
          test -n "$SMOKE_WHEEL"
          python -m venv "$SMOKE_ROOT/venv"
          "$SMOKE_PYTHON" -m pip install --upgrade pip
          "$SMOKE_PYTHON" -m pip install "$SMOKE_WHEEL"
          "$SMOKE_PYTHON" -c 'import importlib.util; assert importlib.util.find_spec("openpyxl") is None'
          cd "$SMOKE_ROOT"
          unset ORACLE_PASSWORD_FILE PLSQLWKS_WORKSPACE
          XDG_CONFIG_HOME="$SMOKE_ROOT/config" \
            XDG_DATA_HOME="$SMOKE_ROOT/data" \
            "$SMOKE_ROOT/venv/bin/plsqlwks" --help
          XDG_CONFIG_HOME="$SMOKE_ROOT/config" \
            XDG_DATA_HOME="$SMOKE_ROOT/data" \
            "$SMOKE_PYTHON" -c \
            'import importlib.metadata as metadata; import os; import site;
          from pathlib import Path;
          import plsqlwks;
          from plsqlwks.config import load_config;
          from plsqlwks.workspace import ensure_workspace;
          config = load_config();
          paths = (config.workspace_dir, config.config_file, config.password_file);
          install_roots = tuple(Path(path).resolve() for path in site.getsitepackages());
          assert metadata.version("plsqlwks") == plsqlwks.__version__;
          assert config.autocommit is False;
          assert all(path is not None for path in paths);
          assert not any(resolved == root or root in resolved.parents for path in paths for resolved in (Path(path).resolve(),) for root in install_roots);
          assert Path(os.environ["XDG_DATA_HOME"]).resolve() in config.workspace_dir.resolve().parents;
          assert Path(os.environ["XDG_CONFIG_HOME"]).resolve() in Path(config.config_file).resolve().parents;
          ensure_workspace(config);
          assert "autocommit = no" in Path(config.config_file).read_text(encoding="utf-8")'
          "$SMOKE_PYTHON" -m pip install "${SMOKE_WHEEL}[xlsx]"
          "$SMOKE_PYTHON" -c 'import openpyxl; assert openpyxl.__version__'

  oracle-integration-19c:
    if: >-
      ${{
        github.event.repository.fork == false &&
        github.ref_protected &&
        (
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push'
        )
      }}
    needs:
      - repository-hygiene
      - quality
      - test-non-oracle
      - test-plugins
      - build-smoke
    runs-on: [self-hosted, linux, x64, plsqlwks]
    timeout-minutes: 20
    environment: oracle-integration
    concurrency:
      group: ${{ github.repository }}-oracle-integration-19c
      cancel-in-progress: false
    env:
      ORACLE_USER: ${{ secrets.ORACLE_19C_USER }}
      ORACLE_DSN: ${{ secrets.ORACLE_19C_DSN }}
      PLSQLWKS_TEST_ORACLE: "1"
      PLSQLWKS_TEST_ORACLE_MATRIX: "1"
      PLSQLWKS_TEST_ORACLE_TARGET: 19c
      PLSQLWKS_TEST_ORACLE_DESCRIPTOR_DSN: ${{ secrets.ORACLE_19C_DESCRIPTOR_DSN }}
      PLSQLWKS_TEST_ORACLE_DML_USER: ${{ secrets.ORACLE_19C_DML_USER }}
      PLSQLWKS_TEST_ORACLE_READ_ONLY_USER: ${{ secrets.ORACLE_19C_READ_ONLY_USER }}
      PLSQLWKS_TEST_ORACLE_EXPECTED_DB_UNIQUE_NAME: ${{ secrets.ORACLE_19C_EXPECTED_DB_UNIQUE_NAME }}
      PLSQLWKS_TEST_ORACLE_EXPECTED_CON_NAME: ${{ secrets.ORACLE_19C_EXPECTED_CON_NAME }}
      PLSQLWKS_TEST_ORACLE_EXPECTED_SERVICE_NAME: ${{ secrets.ORACLE_19C_EXPECTED_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --editable '.[dev]'
      - name: Prepare protected Oracle inputs
        env:
          DEVELOPER_PASSWORD: ${{ secrets.ORACLE_19C_PASSWORD }}
          DML_PASSWORD: ${{ secrets.ORACLE_19C_DML_PASSWORD }}
          READ_ONLY_PASSWORD: ${{ secrets.ORACLE_19C_READ_ONLY_PASSWORD }}
          GUARD_TOKEN: ${{ secrets.ORACLE_19C_GUARD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_USER"
          test -n "$ORACLE_DSN"
          test -n "$PLSQLWKS_TEST_ORACLE_DESCRIPTOR_DSN"
          test -n "$PLSQLWKS_TEST_ORACLE_DML_USER"
          test -n "$PLSQLWKS_TEST_ORACLE_READ_ONLY_USER"
          test -n "$PLSQLWKS_TEST_ORACLE_EXPECTED_DB_UNIQUE_NAME"
          test -n "$PLSQLWKS_TEST_ORACLE_EXPECTED_CON_NAME"
          test -n "$PLSQLWKS_TEST_ORACLE_EXPECTED_SERVICE_NAME"
          test -n "$DEVELOPER_PASSWORD"
          test -n "$DML_PASSWORD"
          test -n "$READ_ONLY_PASSWORD"
          test -n "$GUARD_TOKEN"
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"
          case "$GITHUB_RUN_ID" in ""|*[!0-9]*) exit 1 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ""|*[!0-9]*) exit 1 ;; esac
          umask 077
          workspace="$RUNNER_TEMP/plsqlwks-oracle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-19c-workspace"
          test ! -e "$workspace"
          mkdir -m 700 -- "$workspace"
          printf '%s\n' "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:19c" > "$workspace/.ci-owned"
          chmod 600 "$workspace/.ci-owned"
          {
            printf 'PLSQLWKS_WORKSPACE=%s\n' "$workspace"
            printf 'PLSQLWKS_CI_WORKSPACE_CREATED=1\n'
          } >> "$GITHUB_ENV"
          developer_password_file="$workspace/developer.password"
          dml_password_file="$workspace/dml.password"
          read_only_password_file="$workspace/read-only.password"
          guard_token_file="$workspace/guard.token"
          printf '%s' "$DEVELOPER_PASSWORD" > "$developer_password_file"
          printf '%s' "$DML_PASSWORD" > "$dml_password_file"
          printf '%s' "$READ_ONLY_PASSWORD" > "$read_only_password_file"
          printf '%s' "$GUARD_TOKEN" > "$guard_token_file"
          chmod 600 \
            "$developer_password_file" \
            "$dml_password_file" \
            "$read_only_password_file" \
            "$guard_token_file"
          printf 'ORACLE_PASSWORD_FILE=%s\n' "$developer_password_file" >> "$GITHUB_ENV"
          printf 'PLSQLWKS_TEST_ORACLE_DML_PASSWORD_FILE=%s\n' "$dml_password_file" >> "$GITHUB_ENV"
          printf 'PLSQLWKS_TEST_ORACLE_READ_ONLY_PASSWORD_FILE=%s\n' "$read_only_password_file" >> "$GITHUB_ENV"
          printf 'PLSQLWKS_TEST_ORACLE_GUARD_TOKEN_FILE=%s\n' "$guard_token_file" >> "$GITHUB_ENV"
      - name: Run Oracle 19c integration tests
        run: |
          set -euo pipefail
          test -f "$ORACLE_PASSWORD_FILE" && test -s "$ORACLE_PASSWORD_FILE"
          test -f "$PLSQLWKS_TEST_ORACLE_DML_PASSWORD_FILE" && test -s "$PLSQLWKS_TEST_ORACLE_DML_PASSWORD_FILE"
          test -f "$PLSQLWKS_TEST_ORACLE_READ_ONLY_PASSWORD_FILE" && test -s "$PLSQLWKS_TEST_ORACLE_READ_ONLY_PASSWORD_FILE"
          test -f "$PLSQLWKS_TEST_ORACLE_GUARD_TOKEN_FILE" && test -s "$PLSQLWKS_TEST_ORACLE_GUARD_TOKEN_FILE"
          python -m pytest --strict-markers -m oracle
      - name: Remove Oracle temporary files
        if: ${{ always() }}
        run: |
          test -n "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP"
          case "$GITHUB_RUN_ID" in ""|*[!0-9]*) exit 1 ;; esac
          case "$GITHUB_RUN_ATTEMPT" in ""|*[!0-9]*) exit 1 ;; esac
          workspace="$RUNNER_TEMP/plsqlwks-oracle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-19c-workspace"
          expected_owner="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:19c"
          if [ "${PLSQLWKS_CI_WORKSPACE_CREATED:-}" = "1" ]; then
            test "${PLSQLWKS_WORKSPACE:-}" = "$workspace"
            test -d "$workspace"
            test ! -L "$workspace"
            test -f "$workspace/.ci-owned"
            test ! -L "$workspace/.ci-owned"
            test "$(cat "$workspace/.ci-owned")" = "$expected_owner"
            rm -rf -- "$workspace"
          fi

