include:
  - local: .gitlab/ci/release.yml
    rules:
      - if: '$CI_COMMIT_TAG =~ /^plsqlwks-/'

workflow:
  name: "$PIPELINE_NAME"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^plsqlwks-/'
      variables:
        PIPELINE_NAME: "Release $CI_COMMIT_TAG"
    - when: always
      variables:
        PIPELINE_NAME: "plsqlwks verification"

stages:
  - release-validate
  - quality
  - test
  - build
  - integration
  - release-build
  - release

variables:
  PYTHON_VERSION: "3.14"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: "python:${PYTHON_VERSION}-slim"
  interruptible: true
  tags:
    - plsqlwks
    - docker

.install-dev:
  before_script:
    - 'command -v python >/dev/null || { echo "CI preflight failed: Python interpreter is unavailable" >&2; exit 1; }'
    - python tools/dev.py preflight gitlab --expected-python "$PYTHON_VERSION"
    - python tools/dev.py install

repository-hygiene:
  stage: quality
  before_script:
    - 'command -v python >/dev/null || { echo "CI preflight failed: Python interpreter is unavailable" >&2; exit 1; }'
    - python tools/dev.py preflight gitlab --expected-python "$PYTHON_VERSION"
  script:
    - python tools/dev.py hygiene

quality:
  extends: .install-dev
  stage: quality
  script:
    - python tools/dev.py lint

test-and-coverage:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.10"
          - "3.14"
  before_script:
    - 'command -v python >/dev/null || { echo "CI preflight failed: Python interpreter is unavailable" >&2; exit 1; }'
    - python tools/dev.py preflight gitlab --expected-python "$PYTHON_VERSION"
    - python tools/dev.py install --xlsx
  script:
    - python tools/dev.py coverage --report-dir coverage-reports
  artifacts:
    name: "test-coverage-python-$PYTHON_VERSION-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    paths:
      - coverage-reports/junit-non-oracle.xml
      - coverage-reports/junit-plugins.xml
      - coverage-reports/coverage.xml
      - coverage-reports/coverage.json
    reports:
      junit:
        - coverage-reports/junit-non-oracle.xml
        - coverage-reports/junit-plugins.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage-reports/coverage.xml

build-smoke:
  extends: .install-dev
  stage: build
  script:
    - python tools/dev.py build --smoke

.oracle-integration:
  extends: .install-dev
  stage: integration
  interruptible: false
  timeout: 20 minutes
  needs:
    - job: repository-hygiene
      artifacts: false
    - job: quality
      artifacts: false
    - job: test-and-coverage
      artifacts: false
    - job: build-smoke
      artifacts: false
  variables:
    AFTER_SCRIPT_IGNORE_ERRORS: "false"
    PLSQLWKS_TEST_ORACLE: "1"
    PLSQLWKS_TEST_ORACLE_MATRIX: "1"
  before_script:
    - 'command -v python >/dev/null || { echo "CI preflight failed: Python interpreter is unavailable" >&2; exit 1; }'
    - python tools/dev.py preflight gitlab --expected-python "$PYTHON_VERSION" --oracle
    - python tools/dev.py install
  rules:
    - if: '$CI_COMMIT_TAG =~ /^plsqlwks-/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never
  script:
    - export PLSQLWKS_WORKSPACE="$CI_PROJECT_DIR/.ci-oracle-workspace-$CI_JOB_ID"
    - test ! -e "$PLSQLWKS_WORKSPACE"
    - mkdir -m 700 -- "$PLSQLWKS_WORKSPACE"
    - umask 077
    - >-
      python -c 'import hashlib, hmac, os; from pathlib import Path;
      workspace=os.environ["PLSQLWKS_WORKSPACE"];
      token=os.environ["CI_JOB_TOKEN"];
      Path(workspace, ".ci-owned").write_text(
      hmac.new(token.encode(), workspace.encode(), hashlib.sha256).hexdigest(), encoding="ascii")'
    - chmod 600 "$PLSQLWKS_WORKSPACE/.ci-owned"
    - python tools/dev.py test oracle-matrix
  after_script:
    - test -n "$CI_PROJECT_DIR"
    - test -d "$CI_PROJECT_DIR"
    - 'case "$CI_JOB_ID" in ""|*[!0-9]*) exit 1 ;; esac'
    - test -n "$CI_JOB_TOKEN"
    - |
      export PLSQLWKS_WORKSPACE="$CI_PROJECT_DIR/.ci-oracle-workspace-$CI_JOB_ID"
      marker="$PLSQLWKS_WORKSPACE/.ci-owned"
      if [ -d "$PLSQLWKS_WORKSPACE" ] && [ ! -L "$PLSQLWKS_WORKSPACE" ] && \
         [ -f "$marker" ] && [ ! -L "$marker" ]; then
        expected_owner="$(python -c 'import hashlib,hmac,os; workspace=os.environ["PLSQLWKS_WORKSPACE"]; token=os.environ["CI_JOB_TOKEN"]; print(hmac.new(token.encode(), workspace.encode(), hashlib.sha256).hexdigest())')"
        test "$(cat "$marker")" = "$expected_owner"
        rm -rf -- "$PLSQLWKS_WORKSPACE"
      fi

oracle-integration-19c:
  extends: .oracle-integration
  resource_group: oracle-integration-19c
  variables:
    ORACLE_USER: "$ORACLE_19C_USER"
    ORACLE_DSN: "$ORACLE_19C_DSN"
    ORACLE_PASSWORD_FILE: "$ORACLE_19C_PASSWORD_FILE"
    PLSQLWKS_TEST_ORACLE_TARGET: "19c"
    PLSQLWKS_TEST_ORACLE_DESCRIPTOR_DSN: "$ORACLE_19C_DESCRIPTOR_DSN"
    PLSQLWKS_TEST_ORACLE_DML_USER: "$ORACLE_19C_DML_USER"
    PLSQLWKS_TEST_ORACLE_DML_PASSWORD_FILE: "$ORACLE_19C_DML_PASSWORD_FILE"
    PLSQLWKS_TEST_ORACLE_READ_ONLY_USER: "$ORACLE_19C_READ_ONLY_USER"
    PLSQLWKS_TEST_ORACLE_READ_ONLY_PASSWORD_FILE: "$ORACLE_19C_READ_ONLY_PASSWORD_FILE"
    PLSQLWKS_TEST_ORACLE_EXPECTED_DB_UNIQUE_NAME: "$ORACLE_19C_EXPECTED_DB_UNIQUE_NAME"
    PLSQLWKS_TEST_ORACLE_EXPECTED_CON_NAME: "$ORACLE_19C_EXPECTED_CON_NAME"
    PLSQLWKS_TEST_ORACLE_EXPECTED_SERVICE_NAME: "$ORACLE_19C_EXPECTED_SERVICE_NAME"
    PLSQLWKS_TEST_ORACLE_GUARD_TOKEN_FILE: "$ORACLE_19C_GUARD_TOKEN_FILE"

oracle-integration-26ai:
  extends: .oracle-integration
  resource_group: oracle-integration-26ai
  variables:
    ORACLE_USER: "$ORACLE_26AI_USER"
    ORACLE_DSN: "$ORACLE_26AI_DSN"
    ORACLE_PASSWORD_FILE: "$ORACLE_26AI_PASSWORD_FILE"
    PLSQLWKS_TEST_ORACLE_TARGET: "26ai"
    PLSQLWKS_TEST_ORACLE_DESCRIPTOR_DSN: "$ORACLE_26AI_DESCRIPTOR_DSN"
    PLSQLWKS_TEST_ORACLE_DML_USER: "$ORACLE_26AI_DML_USER"
    PLSQLWKS_TEST_ORACLE_DML_PASSWORD_FILE: "$ORACLE_26AI_DML_PASSWORD_FILE"
    PLSQLWKS_TEST_ORACLE_READ_ONLY_USER: "$ORACLE_26AI_READ_ONLY_USER"
    PLSQLWKS_TEST_ORACLE_READ_ONLY_PASSWORD_FILE: "$ORACLE_26AI_READ_ONLY_PASSWORD_FILE"
    PLSQLWKS_TEST_ORACLE_EXPECTED_DB_UNIQUE_NAME: "$ORACLE_26AI_EXPECTED_DB_UNIQUE_NAME"
    PLSQLWKS_TEST_ORACLE_EXPECTED_CON_NAME: "$ORACLE_26AI_EXPECTED_CON_NAME"
    PLSQLWKS_TEST_ORACLE_EXPECTED_SERVICE_NAME: "$ORACLE_26AI_EXPECTED_SERVICE_NAME"
    PLSQLWKS_TEST_ORACLE_GUARD_TOKEN_FILE: "$ORACLE_26AI_GUARD_TOKEN_FILE"
