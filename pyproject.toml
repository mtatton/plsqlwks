[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plsqlwks"
dynamic = ["version"]
description = "An ncurses SQL and PL/SQL workspace for Oracle databases."
readme = "README.md"
license = "LicenseRef-plsqlwks-Donationware"
license-files = ["license.txt"]
requires-python = ">=3.10"
dependencies = [
    "oracledb>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
]

[project.urls]
Repository = "https://gitlab.com/unununu/plsqlwks"
Issues = "https://gitlab.com/unununu/plsqlwks/-/issues"
Changelog = "https://gitlab.com/unununu/plsqlwks/-/blob/main/CHANGELOG.md"

[project.scripts]
plsqlwks = "plsqlwks.ui:main"

[project.optional-dependencies]
xlsx = [
    "openpyxl>=3.1",
]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.8",
    "wheel>=0.43",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "plsqlwks.__version__"}

[tool.setuptools.packages.find]
include = ["plsqlwks*"]
exclude = ["tests*", "tools*", "workspace*", "vdb*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The compatibility facade and application mixins intentionally re-export imports.
"plsqlwks/config/__init__.py" = ["F401"]
"plsqlwks/ui/__init__.py" = ["F401", "F403", "F405"]
"plsqlwks/ui/app_*.py" = ["F401", "F403", "F405"]
# These helpers retain the original shared-constant and facade export pattern.
"plsqlwks/ui/browser.py" = ["F403", "F405"]
"plsqlwks/ui/completion.py" = ["F401"]
"plsqlwks/ui/help.py" = ["F403", "F405"]
"plsqlwks/ui/keys.py" = ["F403", "F405"]
"plsqlwks/ui/results.py" = ["F403", "F405"]
"plsqlwks/ui/sql.py" = ["F401", "F403", "F405"]
"plsqlwks/ui/state.py" = ["F403", "F405"]
"plsqlwks/ui/syntax.py" = ["F401", "F403", "F405"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "plsqlwks.db.editing",
    "plsqlwks.db.execution",
    "plsqlwks.db.explain",
    "plsqlwks.db.metadata",
]
ignore_errors = true
