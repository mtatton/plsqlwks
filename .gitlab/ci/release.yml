.release-tag-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^plsqlwks-/'
    - when: never

release-identity:
  extends: .release-tag-rules
  stage: release-validate
  interruptible: false
  before_script:
    - 'command -v python >/dev/null || { echo "CI preflight failed: Python interpreter is unavailable" >&2; exit 1; }'
    - python tools/dev.py preflight gitlab --expected-python "$PYTHON_VERSION"
  script:
    - test "$CI_COMMIT_REF_PROTECTED" = "true"
    - python tools/dev.py release-check --tag "$CI_COMMIT_TAG" --project-name "$CI_PROJECT_NAME" --notes-out release-notes.md
    - test -s release-notes.md
  artifacts:
    name: "$CI_COMMIT_TAG-release-notes"
    expire_in: 1 day
    paths:
      - release-notes.md

release-build:
  extends: .release-tag-rules
  stage: release-build
  interruptible: false
  variables:
    GIT_STRATEGY: clone
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  cache: []
  needs:
    - job: release-identity
      artifacts: false
    - job: repository-hygiene
      artifacts: false
    - job: quality
      artifacts: false
    - job: test-and-coverage
      artifacts: false
    - job: build-smoke
      artifacts: false
    - job: oracle-integration-19c
      artifacts: false
    - job: oracle-integration-26ai
      artifacts: false
  before_script:
    - 'command -v python >/dev/null || { echo "CI preflight failed: Python interpreter is unavailable" >&2; exit 1; }'
    - python tools/dev.py preflight gitlab --expected-python "$PYTHON_VERSION"
    - python tools/dev.py hygiene
    - python tools/dev.py install-release
  script:
    - python tools/dev.py release-build --tag "$CI_COMMIT_TAG" --project-name "$CI_PROJECT_NAME"
    - printf 'RELEASE_BUILD_JOB_URL=%s\n' "$CI_JOB_URL" > release-build.env
  artifacts:
    name: "$CI_COMMIT_TAG-distributions"
    expire_in: never
    paths:
      - dist/*.whl
      - dist/*.tar.gz
      - dist/SHA256SUMS
    reports:
      dotenv: release-build.env

release-publish:
  extends: .release-tag-rules
  image: registry.gitlab.com/gitlab-org/cli:v1.58.0
  stage: release
  interruptible: false
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  cache: []
  needs:
    - job: release-identity
      artifacts: true
    - job: release-build
      artifacts: true
  script:
    - test "$CI_COMMIT_REF_PROTECTED" = "true"
    - test -s release-notes.md
    - sha256sum --check dist/SHA256SUMS
    - if [ -n "${RELEASE_ACCESS_TOKEN:-}" ]; then export GITLAB_TOKEN="$RELEASE_ACCESS_TOKEN"; fi
    - release_version="${CI_COMMIT_TAG#plsqlwks-}"
    - >-
      glab release create "$CI_COMMIT_TAG"
      --name "plsqlwks $release_version"
      --notes-file release-notes.md
      --ref "$CI_COMMIT_SHA"
      --no-update
      --package-name plsqlwks
      --use-package-registry
      --assets-links "[{\"name\":\"SLSA provenance and build evidence\",\"url\":\"${RELEASE_BUILD_JOB_URL}\",\"link_type\":\"other\"}]"
      dist/*.whl dist/*.tar.gz dist/SHA256SUMS
